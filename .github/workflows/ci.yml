name: Local acceptance
on:
  pull_request:
  # Release pushes to main and experimental run these checks through release.yml.
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_USER: esportsviewer
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: esportsviewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esportsviewer -d esportsviewer_test" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://esportsviewer:local-test-only@127.0.0.1:5432/esportsviewer_test
      NEXT_TELEMETRY_DISABLED: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run:
          pnpm --filter @summonersnet/web exec playwright install --with-deps chromium firefox
          webkit
      - run: pnpm browser:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-evidence
          path: |
            packages/*/coverage/coverage-summary.json
            apps/web/coverage/coverage-summary.json
            apps/web/playwright-report
            apps/web/test-results
            output/playwright
