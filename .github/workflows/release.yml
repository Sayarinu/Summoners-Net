name: Release

# Every push to experimental publishes a prerelease and every push to main a stable release.
# Releases are GitHub tags and notes only; nothing is deployed.
on:
  push:
    branches: [main, experimental]

permissions:
  contents: read

# Releases run one at a time so each bumps the version the previous one published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    name: Choose release version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.choose.outputs.version }}
      previous: ${{ steps.choose.outputs.previous }}
      prerelease: ${{ steps.choose.outputs.prerelease }}
      publish: ${{ steps.choose.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Bump by the largest change since the last release
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs version
          echo "Release version: $(grep '^version=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish versioned release
    needs: [verify, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Publish tag and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          title="SummonersNet ${VERSION}"
          if [ "$PRERELEASE" = true ]; then
            title="SummonersNet Experimental ${VERSION}"
          fi
          # Published releases are never overwritten.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "This build is already published."
            exit 0
          fi
          node scripts/release.mjs notes "$VERSION" "$PREVIOUS" "$RUNNER_TEMP/notes.md"
          latest=false
          if [ "$PRERELEASE" != true ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" ]; then
            latest=true
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease="$PRERELEASE" --latest="$latest" \
            --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
