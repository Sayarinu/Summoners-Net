services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    environment:
      POSTGRES_DB: esportsviewer
      POSTGRES_USER: esportsviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-esportsviewer-only}
    restart: unless-stopped
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - esportsviewer_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esportsviewer -d esportsviewer"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  esportsviewer_data:
