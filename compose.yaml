services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:a0cbdbbcc57f7317ca183ac9d10eb3af72b5b05b2f25acad58e765bd2b139099
    environment:
      POSTGRES_DB: esportsviewer
      POSTGRES_USER: esportsviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-esportsviewer-only}
    restart: unless-stopped
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - esportsviewer_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esportsviewer -d esportsviewer"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  esportsviewer_data:
