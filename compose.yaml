services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: esportsviewer
      POSTGRES_USER: esportsviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-esportsviewer-only}
    restart: unless-stopped
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - esportsviewer_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esportsviewer -d esportsviewer"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  esportsviewer_data:
